# theme = "tokyonight_moon"
# theme = "gruvbox_dark_hard"
theme = "catppuccin_mocha+"

[editor]
line-number = "relative"
true-color = true
cursorline = true
gutters = ["diff", "diagnostics", "line-numbers", "spacer"]
color-modes = true
bufferline = "multiple"
end-of-line-diagnostics = "hint"
popup-border = "all"  # Shows borders around popups for clarity

auto-format = true
auto-save = true

[editor.inline-diagnostics]
# cursor-line="error"
cursor-line = "warning"  # Show diagnostics for current line
other-lines = "disable"  # Hide diagnostics for other lines

[editor.soft-wrap]
enable = true

[editor.lsp]
display-inlay-hints = true

[editor.statusline]
left = ["mode", "version-control"]
center = ["file-absolute-path", "position-percentage"]
right = ["register", "spinner", "diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.indent-guides]
render = true
character = "▏" # Some characters that work well: "▏", "┆", "┊", "⸽"
skip-levels = 1

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'"' = '"'
"'" = "'"
'`' = '`'
'<' = '>'

# At most one section each of 'keys.normal', 'keys.insert' and 'keys.select'
[keys.normal]
C-s = ":w" # Maps the Control-s to the typable command :w which is an alias for :write (save file)
g = { A = "code_action" } # Maps `ga` to show possible code actions
"ret" = ["open_below", "normal_mode"] # Maps the enter key to open_below then re-enter normal mode
"backspace" = { r = ":run-shell-command cargo run", b = ":run-shell-command cargo build", t = ":run-shell-command cargo test", s = [":w", ":config-reload"], o = ":config-open", c = ":buffer-close", a = ":sh bash ~/.config/helix/herdr-split.sh right claude", g = { r = ":run-shell-command go run .", b = ":run-shell-command go build ." } }

esc = ["collapse_selection", "keep_primary_selection"]
C-A-j = ["extend_to_line_bounds", "delete_selection", "paste_after"]
C-A-k = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]

# herdr panes. herdr-split.sh resolves helix's own pane id, splits it, and
# exports HX_PANE/HERDR_PANE so the spawned command can send text back.
[keys.normal.C-y]
# Open the file(s) in the current window
y = ":sh bash ~/.config/helix/herdr-split.sh right 'bash ~/.config/helix/yazi-picker.sh open'"
# Open the file(s) in a vertical pane
v = ":sh bash ~/.config/helix/herdr-split.sh right 'bash ~/.config/helix/yazi-picker.sh vsplit'"
# Open the file(s) in a horizontal pane
h = ":sh bash ~/.config/helix/herdr-split.sh down 'bash ~/.config/helix/yazi-picker.sh hsplit'"

[keys.normal.space]
i = ":toggle lsp.display-inlay-hints"
pageup = ":bp"
pagedown = ":bn"

[keys.insert]
"A-x" = "normal_mode" # Maps Alt-X to enter normal mode
j = { k = "normal_mode" } # Maps `jk` to exit insert mode

[keys.select]
# Wrap selection in an HTML tag; htag.sh prompts for the tag name via rofi.
T = ":pipe bash ~/.config/helix/htag.sh"
# Strip the outermost <tag>...</tag> from the selection (inverse of T).
A-t = ":pipe perl -0777 -pe 's{\\A(\\s*)<[^>]+>(.*)</[^>]+>(\\s*)\\z}{$1$2$3}s'"
# Rename the surrounding tag, keeping attributes (nvim-surround's cst).
A-r = ":pipe bash ~/.config/helix/retag.sh"
C-A-j = ["extend_to_line_bounds", "delete_selection", "paste_after"]
C-A-k = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
