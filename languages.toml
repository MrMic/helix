# language.toml config for inlay hit

## RUST
[language-server.rust-analyzer.config]
check.command = "clippy"

[[language]]
name = "rust"
auto-format = true
language-servers = ["rust-analyzer"]


## GO

[language-server.gopls]
command = "gopls"
config = { "gofumpt" = true, "local" = "goimports", "semanticTokens" = true, "staticcheck" = true, "verboseOutput" = true, "analyses" = { "nilness" = true, unusedparams = true, unusedwrite = true, useany = true }, usePlaceholders = true, completeUnimported = true, hints = { "assignVariableType" = true, "compositeLiteralFields" = true, "compositeLiteralTypes" = true, "constantValues" = true, "functionTypeParameters" = true, "parameterNames" = true, "rangeVariableTypes" = true } }

[[language]]
name = "go"
roots = ["go.work", "go.mod"]
auto-format = true
comment-token = "//"
language-servers = ["gopls"]
formatter = { command = "goimports" }

## CSS
[language-server.css-language-server]
command = "vscode-css-language-server"
args = ["--stdio"]

[[language]]
name = "css"
formatter = { command = 'prettier', args = ["--parser", "css"] }
auto-format = true
language-servers = ["css-language-server", "emmet-ls"]


## HTML
[[language]]
name = "html"
scope = "text.html.basic"
roots = ["package.json", ".git"]
indent = { tab-width = 2, unit = "  " }
language-servers = ["vscode-html-language-server", "emmet-ls"]
auto-format = true

[language-server.vscode-html-language-server]
command = "vscode-html-language-server"
args = ["--stdio"]

# Option 1: Use proper TOML table syntax (RECOMMENDED)
[language-server.vscode-html-language-server.config]
provideFormatter = true

[language-server.vscode-html-language-server.config.embeddedLanguages]
css = true
javascript = true


## EMMET LSP
[language-server.emmet-ls]
command = "emmet-language-server"
args = ["--stdio"]

# Without this, tsx falls back to html syntax and emits class= instead of
# className=. jsx is recognised on its own.
[language-server.emmet-ls.config.includeLanguages]
tsx = "jsx"

# jsx/tsx are separate languages in helix, so emmet has to be listed on each.
# The default server list is repeated because a user list replaces it.
[[language]]
name = "jsx"
language-servers = ["typescript-language-server", "emmet-ls"]

[[language]]
name = "tsx"
language-servers = ["typescript-language-server", "emmet-ls"]


## TYPESCRIPT
[language-server.angular]
command = "npx"
args = [
  "ngserver",
  "--stdio",
  "--tsProbeLocations",
  "/home/mic/.nvm/versions/node/v22.21.1/lib/node_modules/typescript/lib, ./node_modules",
  "--ngProbeLocations",
  "/home/mic/.nvm/versions/node/v22.21.1/lib/node_modules/@angular/language-server/bin, ./node_modules",
]

[language-server.eslint]
command = "vscode-eslint-language-server"
args = ["--stdio"]

[language-server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]
# config = { hostinfo = "helix", inlayHintsOptions = { "includeInlayFunctionParameterTypeHints" = true } }

[[language]]
name = "typescript"
# file-types=["tsx", "ts"]
roots = ["tsconfig.json"]
formatter = { command = "biome", args = [
  "format",
  "--stdin-file-path",
  "*.ts",
] }
auto-format = true
language-servers = ["typescript-language-server", "angular", "eslint"]


## JAVASCRIPT
[[language]]
name = "javascript"
formatter = { command = 'prettier', args = ["--parser", "typescript"] }
auto-format = true
language-servers = ["typescript-language-server"]


## JSON
[[language]]
name = "json"
formatter = { command = 'prettier', args = ["--parser", "json"] }
auto-format = true


## LUA
[[language]]
name = "lua"
language-servers = ["lua-language-server"]


## PHP
# Each server is gated on a marker file at the project root, so Laravel gets
# intelephense and Symfony gets phpactor. Matching is top-level only.
[language-server.phpactor]
command = "phpactor"
args = ["language-server"]
required-root-patterns = ["symfony.lock"]

[language-server.intelephense]
command = "intelephense"
args = ["--stdio"]
required-root-patterns = ["artisan"]

[[language]]
name = "php"
language-servers = ["intelephense", "phpactor"]

# Blade templates. Highlighting and the html/php/js injections ship with helix;
# only indent and the formatter need setting. intelephense ignores .blade.php.
[[language]]
name = "blade"
indent = { tab-width = 4, unit = "    " }
# emmet-language-server falls back to html syntax for unknown language ids,
# so blade needs no includeLanguages mapping.
language-servers = ["emmet-ls"]
formatter = { command = "blade-formatter", args = ["--stdin", "--sort-tailwindcss-classes"] }
auto-format = true


## PYTHON
[language-server.pyright.config.python.analysis]
typeCheckingMode = "basic"

[language-server.ruff.config.settings.lint]
ignore = ["E501"]

[language-server.pyright]
command = "uv"
args = ["run", "pyright-langserver", "--stdio"]

[language-server.ruff]
command = "uv"
args = ["run", "ruff", "server", "--preview"]

[[language]]
name = "python"
# formatter = { command = "uv", args = [
#   "run",
#   "black"
#   "--line-range",
#   "88",
#   "--quiet",
#   "-",
# ] }
auto-format = true
language-servers = ["ruff", "pyright"]

# [language.formatter]
# command = "black"
# args = ["--line-length", "88", "--quiet", "-"]


## VUE
[language-server.vue-language-server]
command = "vue-language-server"
args = ["--stdio"]

[[language]]
name = "vue"
auto-format = true
file-types = ["vue"]
injection-regex = "vue"
roots = ["package.json"]
scope = "text.html.vue"
formatter = { command = "prettier", args = ["--parser", "vue"] }
language-servers = ["vue-language-server", "emmet-ls"]


## JAVA - Optimized for Quarkus and Mockito
[[language]]
name = "java"
language-servers = ["jdtls", "spring-boot-ls"]
auto-format = true
formatter = { command = "google-java-format", args = ["-"] }

[language-server.jdtls]
command = "/home/mic/.local/share/LazyVim/mason/bin/jdtls"
args = [
    "-configuration", "/home/mic/.cache/jdtls/config",
    "-data", "/home/mic/.cache/jdtls/workspace",
    "--jvm-arg=-javaagent:/home/mic/.local/share/LazyVim/mason/packages/jdtls/lombok.jar"
]

[language-server.jdtls.config]
# Quarkus-specific settings
java.configuration.runtimes = [
    { name = "JavaSE-17", path = "/home/mic/.sdkman/candidates/java/current" },
    { name = "JavaSE-21", path = "/home/mic/.sdkman/candidates/java/current", default = true }
]

# Import organization - prioritize Quarkus and Mockito
java.completion.importOrder = [
    "java",
    "javax",
    "jakarta",
    "io.quarkus",
    "org.eclipse.microprofile",
    "org.junit.jupiter",
    "org.mockito",
    "org.assertj",
    "",
    "#"
]

# Enable static imports for Mockito and JUnit
java.completion.favoriteStaticMembers = [
    "org.junit.jupiter.api.Assertions.*",
    "org.mockito.Mockito.*",
    "org.mockito.ArgumentMatchers.*",
    "org.mockito.BDDMockito.*",
    "org.assertj.core.api.Assertions.*",
    "io.restassured.RestAssured.*"
]

# Quarkus dev mode support
java.autobuild.enabled = true
java.maxConcurrentBuilds = 2

# Better code completion for annotations
java.completion.filteredTypes = [
    "com.sun.*",
    "sun.*",
    "jdk.*"
]

# Enable faster builds for Quarkus
java.import.gradle.wrapper.enabled = true
java.import.maven.enabled = true

# Code generation preferences for Quarkus/Mockito
java.codeGeneration.hashCodeEquals.useJava7Objects = true
java.codeGeneration.useBlocks = true
java.codeGeneration.generateComments = true

# Quarkus-specific ignore patterns
java.project.resourceFilters = ["node_modules", ".git", "target", "build"]

[language-server.spring-boot-ls]
command = "/home/mic/.sdkman/candidates/java/current/bin/java"
args = [
    "-XX:TieredStopAtLevel=1",
    "-Xmx1G",
    "-XX:+UseZGC",
    "-Dsts.lsp.client=vscode",
    "-Dsts.log.file=/dev/null",
    "-jar",
    "/home/mic/.local/share/nvChad/mason/packages/vscode-spring-boot-tools/extension/language-server/spring-boot-language-server-2.2.0-SNAPSHOT-exec.jar"
]

[language-server.jdtls.config.java.inlayHints]
parameterNames.enabled = "all"  # Show parameter names

